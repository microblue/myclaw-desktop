name: Linux Install Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'scripts/**'
      - 'electron-builder.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/linux-install-smoke.yml'
      - 'tests/e2e/install-smoke.spec.ts'
      - 'tests/e2e/fixtures/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: System packages required for Electron + AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgtk-3-0 \
            libnss3 \
            libgbm1 \
            libxss1 \
            libasound2t64 \
            fuse \
            libfuse2

      - name: Build Linux package (AppImage)
        run: pnpm run package:linux

      - name: Locate AppImage
        id: locate
        run: |
          # electron-builder produces both x64 + arm64 AppImages; pick the
          # one matching the runner's arch so we don't try to launch an
          # incompatible binary.  Resolve to absolute path — later steps
          # cd into a tempdir before invoking.
          # electron-builder writes Linux AppImage with the kernel arch
          # name (`x86_64` / `aarch64`), not the electron-builder short
          # arch (`x64` / `arm64`).  Match the actual on-disk name.
          case "$(uname -m)" in
            x86_64) arch_pattern="*linux-x86_64*";;
            aarch64|arm64) arch_pattern="*linux-arm64*";;
            *) echo "Unsupported runner arch: $(uname -m)"; exit 1;;
          esac
          appimage=$(find "$PWD/release" -maxdepth 2 -name "MyClaw.One-${arch_pattern}.AppImage" -type f | head -n 1)
          if [ -z "$appimage" ]; then
            echo "AppImage not found under release/ for arch $(uname -m)"
            ls -la release || true
            exit 1
          fi
          chmod +x "$appimage"
          echo "Found AppImage: $appimage"
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"

      - name: Seed .openclaw canary (regression guard)
        run: |
          mkdir -p "$HOME/.openclaw"
          echo "canary-linux-$(date -u +%FT%TZ)" > "$HOME/.openclaw/canary.txt"
          ls -la "$HOME/.openclaw/"

      - name: Extract AppImage to a writable dir
        id: extract
        run: |
          # Running AppImage --appimage-extract avoids needing FUSE under
          # the strict CI sandbox.  The extracted squashfs-root is fully
          # functional — same files Playwright would launch from a mounted
          # AppImage.
          extract_dir=$(mktemp -d)
          cd "$extract_dir"
          "${{ steps.locate.outputs.appimage }}" --appimage-extract >/dev/null
          # squashfs-root contains AppRun + the Electron binary.
          exe="$extract_dir/squashfs-root/myclaw-desktop"
          if [ ! -x "$exe" ]; then
            # Fall back to the AppRun launcher if the named binary differs.
            exe="$extract_dir/squashfs-root/AppRun"
          fi
          if [ ! -x "$exe" ]; then
            echo "No executable found in extracted AppImage:"
            ls -la "$extract_dir/squashfs-root" | head -40
            exit 1
          fi
          echo "Executable: $exe"
          echo "exe=$exe" >> "$GITHUB_OUTPUT"

      - name: Verify canary survived extract
        run: |
          test -f "$HOME/.openclaw/canary.txt" || { echo "canary lost!"; exit 1; }
          echo "Canary OK"

      # NB: previously a "Smoke launch" pre-check launched the binary,
      # slept 10s, then killed it.  That left ~/.myclaw/runtime/ in a
      # half-installed state (npm install was killed mid-flight) which
      # the next launch had to recover from inside the 6-min Playwright
      # wait — racing the clock.  Playwright launches the binary itself
      # and waits for the main window properly, so the pre-check is
      # redundant.

      - name: Run install-smoke E2E against extracted AppImage
        env:
          MYCLAW_INSTALLED_EXE: ${{ steps.extract.outputs.exe }}
        run: |
          xvfb-run -a pnpm exec playwright test tests/e2e/install-smoke.spec.ts --reporter=list

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-install-smoke-artifacts
          path: |
            playwright-report
            test-results
            /tmp/myclaw-launch.log
          if-no-files-found: warn
          retention-days: 7
